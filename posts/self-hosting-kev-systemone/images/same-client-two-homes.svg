<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drop-in replacement: the same TypeSafe client, local instead of hosted">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="600" fill="#24292f">Same client, two homes</text>
  <text x="24" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#57606a">the same TypeSafe client, local instead of hosted</text>

  <!-- client -->
  <rect x="24" y="84" width="170" height="120" rx="10" fill="#f6f8fa" stroke="#24292f" stroke-width="1.5"/>
  <text x="109" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#24292f">TypeSafeClient</text>
  <text x="109" y="132" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">base_url + model</text>
  <text x="109" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">Choice / Noul / Score</text>
  <text x="109" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">works with Spring AI too</text>

  <!-- hosted path -->
  <text x="257" y="92" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#d1242f">hosted</text>
  <path d="M 194 100 H 320" stroke="#d1242f" stroke-width="2" stroke-dasharray="6 4" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.9s" repeatCount="indefinite"/></path>
  <rect x="320" y="68" width="240" height="64" rx="10" fill="#fafbfc" stroke="#d1242f" stroke-width="1.5"/>
  <text x="440" y="98" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#24292f">typesafe.ai · Jev</text>
  <text x="440" y="118" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">your data crosses the wire</text>

  <!-- local path -->
  <text x="257" y="212" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#1a7f37">local · docker compose</text>
  <path d="M 194 220 H 320" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 4" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.9s" begin="0.4s" repeatCount="indefinite"/></path>
  <rect x="320" y="188" width="240" height="64" rx="10" fill="#f6fff8" stroke="#1a7f37" stroke-width="2"/>
  <rect x="320" y="188" width="240" height="64" rx="10" fill="none" stroke="#1a7f37" stroke-width="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></rect>
  <text x="440" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#24292f">localhost:8008 · kev</text>
  <text x="440" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">model: kev-latest</text>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
    <rect x="512" y="196" width="44" height="22" rx="11" fill="#1a7f37"/>
    <text x="534" y="211" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#ffffff">chosen</text>
  </g>

  <!-- GPU on the local path -->
  <path d="M 560 220 H 588" stroke="#0969da" stroke-width="2" stroke-dasharray="6 4" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" begin="0.6s" repeatCount="indefinite"/></path>
  <rect x="588" y="188" width="148" height="64" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <rect x="588" y="188" width="148" height="64" rx="10" fill="none" stroke="#0969da" stroke-width="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></rect>
  <text x="662" y="216" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" fill="#24292f">my RTX 4090</text>
  <text x="662" y="236" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">16 GB · WSL2</text>

  <!-- the only change -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
    <text x="24" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">the only change is the base_url</text>
    <rect x="24" y="300" width="712" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="380" y="325" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#24292f">api_key="local" · base_url="http://127.0.0.1:8008" · model="kev-latest"</text>
  </g>

  <text x="24" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">Laya and the other open System One models follow the same contract —</text>
  <text x="24" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">swap the base_url and you've swapped the model.</text>
</svg>
