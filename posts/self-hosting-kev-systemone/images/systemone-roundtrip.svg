<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System One round-trip: typed questions in, calibrated answers out">
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="24" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="600" fill="#24292f">POST /v1/systemone</text>
  <text x="24" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#57606a">one forward pass · no text generation</text>

  <!-- request card -->
  <rect x="24" y="66" width="280" height="330" rx="12" fill="#fafbfc" stroke="#24292f" stroke-width="1.5"/>
  <text x="164" y="92" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#24292f">request</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <rect x="44" y="106" width="240" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="56" y="124" font-weight="600" fill="#24292f">state</text>
    <text x="56" y="140" fill="#57606a">"My withdrawal failed 3 days in a row..."</text>
    <rect x="44" y="166" width="240" height="38" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="56" y="190" fill="#24292f">questions map</text>
    <rect x="56" y="214" width="216" height="26" rx="6" fill="#f6f8fa" stroke="#0969da"/>
    <text x="164" y="232" text-anchor="middle" fill="#0969da">noul · is this urgent?</text>
    <rect x="56" y="250" width="216" height="26" rx="6" fill="#f6f8fa" stroke="#1a7f37"/>
    <text x="164" y="268" text-anchor="middle" fill="#1a7f37">choice · which team?</text>
    <rect x="56" y="286" width="216" height="26" rx="6" fill="#f6f8fa" stroke="#d1242f"/>
    <text x="164" y="304" text-anchor="middle" fill="#d1242f">score · how frustrated?</text>
    <text x="56" y="344" fill="#57606a">mixed types in one request</text>
    <text x="56" y="362" fill="#57606a">options carried in criteria</text>
  </g>

  <!-- arrow -->
  <path d="M 316 231 H 430" stroke="#0969da" stroke-width="2.5" stroke-dasharray="6 4" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/></path>
  <polygon points="430,225 446,231 430,237" fill="#0969da"/>

  <!-- engine -->
  <rect x="448" y="156" width="120" height="150" rx="12" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <rect x="448" y="156" width="120" height="150" rx="12" fill="none" stroke="#0969da" stroke-width="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></rect>
  <text x="508" y="204" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#24292f">kev.serve</text>
  <text x="508" y="224" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">one forward pass</text>
  <text x="508" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">per question</text>
  <text x="508" y="276" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#57606a">rows share the state</text>

  <!-- arrow -->
  <path d="M 580 231 H 600" stroke="#1a7f37" stroke-width="2.5" stroke-dasharray="6 4" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></path>

  <!-- answers card -->
  <rect x="604" y="66" width="132" height="330" rx="12" fill="#f6fff8" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="670" y="92" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#1a7f37">answers</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.4s" fill="freeze"/>
    <rect x="620" y="108" width="100" height="52" rx="6" fill="#ffffff" stroke="#0969da"/>
    <text x="670" y="128" text-anchor="middle" font-weight="600" fill="#0969da">noul</text>
    <text x="670" y="146" text-anchor="middle" fill="#24292f">0.73</text>
    <rect x="620" y="172" width="100" height="64" rx="6" fill="#ffffff" stroke="#1a7f37"/>
    <text x="670" y="192" text-anchor="middle" font-weight="600" fill="#1a7f37">choice</text>
    <text x="670" y="210" text-anchor="middle" fill="#24292f">returns</text>
    <text x="670" y="226" text-anchor="middle" fill="#57606a">p: 0.50</text>
    <rect x="620" y="248" width="100" height="64" rx="6" fill="#ffffff" stroke="#d1242f"/>
    <text x="670" y="268" text-anchor="middle" font-weight="600" fill="#d1242f">score</text>
    <text x="670" y="286" text-anchor="middle" fill="#24292f">1.3</text>
    <text x="670" y="302" text-anchor="middle" fill="#57606a">legend 0..2</text>
    <text x="670" y="344" text-anchor="middle" fill="#57606a">calibrated</text>
    <text x="670" y="360" text-anchor="middle" fill="#57606a">probabilities</text>
  </g>
</svg>
